<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="leaflet.css"/>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; height:100%; }
        #map { width:100%; height:100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="leaflet.js"></script>
    <script>
        delete L.Icon.Default.prototype._getIconUrl;
        L.Icon.Default.mergeOptions({
            iconUrl: 'marker-icon.png',
            iconRetinaUrl: 'marker-icon-2x.png',
            shadowUrl: 'marker-shadow.png'
        });

        var map = L.map('map', { center:[20,0], zoom:3 });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 18
        }).addTo(map);

        var issIcon = L.divIcon({
            html: '<div style="font-size:28px;">🛰️</div>',
            iconSize: [32,32],
            iconAnchor: [16,16],
            className: ''
        });

        var marker = null;

        function updateISS(lat, lon) {
            var pos = [lat, lon];
            if (marker === null) {
                marker = L.marker(pos, { icon: issIcon })
                    .addTo(map)
                    .bindPopup('<b>ISS ao vivo</b><br>Lat: ' + lat.toFixed(4) + '° Lon: ' + lon.toFixed(4) + '°');
                map.setView(pos, 3);
            } else {
                marker.setLatLng(pos);
                map.panTo(pos);
            }
        }
    </script>
</body>
</html>
