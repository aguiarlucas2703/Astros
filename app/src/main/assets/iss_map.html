<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ISS Tracker</title>
    <!-- Leaflet carregado localmente — sem dependência de CDN -->
    <link rel="stylesheet" href="leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #map { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="leaflet.js"></script>
    <script>
        // Corrigir caminho dos ícones padrão do Leaflet para assets locais
        delete L.Icon.Default.prototype._getIconUrl;
        L.Icon.Default.mergeOptions({
            iconUrl: 'marker-icon.png',
            iconRetinaUrl: 'marker-icon-2x.png',
            shadowUrl: 'marker-shadow.png',
        });

        var map = L.map('map', {
            center: [20, 0],
            zoom: 3,
            zoomControl: true
        });

        // Tiles do OpenStreetMap — acessados com User-Agent de navegador (sem bloqueio 403)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 18
        }).addTo(map);

        // Ícone personalizado para a ISS (emoji de satélite)
        var issIcon = L.divIcon({
            html: '<div style="font-size:30px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));">🛰️</div>',
            iconSize: [36, 36],
            iconAnchor: [18, 18],
            className: ''
        });

        var marker = null;

        // Chamada pelo Android via evaluateJavascript()
        function updateISS(lat, lon) {
            var pos = [lat, lon];
            if (marker === null) {
                marker = L.marker(pos, { icon: issIcon })
                    .addTo(map)
                    .bindPopup(
                        '<b>🛰️ ISS ao vivo</b><br>' +
                        'Lat: ' + lat.toFixed(4) + '°<br>' +
                        'Lon: ' + lon.toFixed(4) + '°'
                    );
                map.setView(pos, 3);
            } else {
                marker.setLatLng(pos);
                map.panTo(pos);
            }
        }
    </script>
</body>
</html>
